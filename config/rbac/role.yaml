---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: advancedstatefulset-controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  - persistentvolumeclaims
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workload.fluid.io
  resources:
  - advancedstatefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workload.fluid.io
  resources:
  - advancedstatefulsets/finalizers
  verbs:
  - update
- apiGroups:
  - workload.fluid.io
  resources:
  - advancedstatefulsets/status
  verbs:
  - get
  - patch
  - update
